<svg xmlns="http://www.w3.org/2000/svg" width="680pt" height="695pt" viewBox="0 0 680 695">
<rect x="0" y="0" width="680" height="695" fill="#121212"/>
<text x="20.0" y="36.0" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#dfdfdf" xml:space="preserve">A Pirate: a local agent a Pond gives work to</text>
<text x="20.0" y="56.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">Container view · Boring Pirates 0.3.10</text>
<text x="20.0" y="72.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">Its own account, its own model, its own grants; it reports a claim and the evidence of its writes.</text>
<g class="cluster"><rect x="6" y="230" width="442" height="267" fill="none" stroke="#656c69" stroke-width="1"/>
<text x="16.0" y="487.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">The Pirate's own Unix account and systemd sandbox</text>
</g>
<g class="edge"><title>worker->pirate</title><path fill="none" stroke="#9d7f58" stroke-dasharray="1.5,4" stroke-linecap="round" stroke-width="2" d="M181.3,174.0 L279.2,239.0"/><polygon fill="#9d7f58" stroke="#9d7f58" points="286.7,244.0 281.4,235.7 277.0,242.4"/></g>
<g class="edge"><title>pirate->worker</title><path fill="none" stroke="#9d7f58" stroke-dasharray="1.5,4" stroke-linecap="round" stroke-width="2" d="M261.4,244.0 L163.5,179.0"/><polygon fill="#9d7f58" stroke="#9d7f58" points="156.0,174.0 161.3,182.3 165.7,175.6"/></g>
<g class="edge"><title>pirate->authority</title><path fill="none" stroke="#9d7f58" stroke-dasharray="1.5,4" stroke-linecap="round" stroke-width="2" d="M338.0,244.0 L338.0,183.0"/><polygon fill="#9d7f58" stroke="#9d7f58" points="338.0,174.0 334.0,183.0 342.0,183.0"/></g>
<g class="edge"><title>pirate->provider</title><path fill="none" stroke="#9c80ab" stroke-width="1.4" d="M405.4,244.0 L485.0,193.8"/><polygon fill="#9c80ab" stroke="#9c80ab" points="492.6,189.0 482.9,190.4 487.1,197.2"/></g>
<g class="edge"><title>pirate->services</title><path fill="none" stroke="#6f8da4" stroke-width="1.4" d="M434.0,283.3 L455.0,282.5"/><polygon fill="#6f8da4" stroke="#6f8da4" points="464.0,282.2 454.9,278.5 455.1,286.5"/></g>
<g class="edge"><title>pirate->state</title><path fill="none" stroke="#9d7f58" stroke-dasharray="1.5,4" stroke-linecap="round" stroke-width="2" d="M242.0,283.3 L221.0,282.5"/><polygon fill="#9d7f58" stroke="#9d7f58" points="212.0,282.2 220.9,286.5 221.1,278.5"/></g>
<g class="edge"><title>pirate->exec</title><path fill="none" stroke="#9d7f58" stroke-dasharray="1.5,4" stroke-linecap="round" stroke-width="2" d="M271.8,329.0 L178.1,389.1"/><polygon fill="#9d7f58" stroke="#9d7f58" points="170.5,394.0 180.3,392.5 175.9,385.8"/></g>
<g class="edge"><title>pirate->home</title><path fill="none" stroke="#9d7f58" stroke-dasharray="1.5,4" stroke-linecap="round" stroke-width="2" d="M338.0,329.0 L338.0,385.0"/><polygon fill="#9d7f58" stroke="#9d7f58" points="338.0,394.0 342.0,385.0 334.0,385.0"/></g>
<g class="node"><title>worker</title><rect x="20" y="104" width="192" height="70" fill="#171e19" stroke="#5f7867" stroke-width="1.2"/>
<text x="30.0" y="122.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#dfdfdf" xml:space="preserve">A Pond</text>
<text x="30.0" y="137.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">[its worker · job_start]</text>
<text x="30.0" y="152.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">hands one flavour an</text>
<text x="30.0" y="167.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">assignment</text>
<path transform="translate(180,112) scale(0.917)" d="M2.5 6h7l2 2.5h10v11.5h-19z" fill="none" stroke="#5f7867" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="node"><title>authority</title><rect x="242" y="104" width="192" height="70" fill="#171e19" stroke="#5f7867" stroke-width="1.2"/>
<text x="252.0" y="122.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#dfdfdf" xml:space="preserve">Service authority</text>
<text x="252.0" y="137.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">[Crocodile controller]</text>
<text x="252.0" y="152.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">a 60-second token for</text>
<text x="252.0" y="167.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">one service, by UID</text>
<path transform="translate(402,112) scale(0.917)" d="M9 6.5 3.5 12 9 17.5 M15 6.5 20.5 12 15 17.5" fill="none" stroke="#5f7867" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="node"><title>provider</title><rect x="464" y="104" width="192" height="85" fill="#1b1b19" stroke="#747570" stroke-width="1.2"/>
<text x="474.0" y="122.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#dfdfdf" xml:space="preserve">Model provider</text>
<text x="474.0" y="137.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">[Mistral, Ollama, ...]</text>
<text x="474.0" y="152.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">the flavour's model, over</text>
<text x="474.0" y="167.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">HTTP(S): a cloud API or</text>
<text x="474.0" y="182.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">a server on the LAN</text>
<path transform="translate(624,112) scale(0.917)" d="M12 8.5a3.5 3.5 0 1 1 0 7a3.5 3.5 0 1 1 0-7z M12 2.5v3 M12 18.5v3 M2.5 12h3 M18.5 12h3 M5.3 5.3l2.1 2.1 M16.6 16.6l2.1 2.1 M5.3 18.7l2.1-2.1 M16.6 7.4l2.1-2.1" fill="none" stroke="#747570" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="node"><title>state</title><rect x="20" y="244" width="192" height="70" fill="#171e19" stroke="#5f7867" stroke-width="1.2"/>
<text x="30.0" y="262.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#dfdfdf" xml:space="preserve">State folder</text>
<text x="30.0" y="277.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">[API key, transcripts]</text>
<text x="30.0" y="292.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">kept even from its own</text>
<text x="30.0" y="307.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">file tools</text>
<path transform="translate(180,252) scale(0.917)" d="M6 2.5h8.5l4 4v15H6z M14.5 2.5v4h4 M9 12h6 M9 15.5h6" fill="none" stroke="#5f7867" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="node"><title>pirate</title><rect x="242" y="244" width="192" height="85" fill="#171e19" stroke="#5f7867" stroke-width="1.2"/>
<text x="252.0" y="262.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#dfdfdf" xml:space="preserve">Pirate</text>
<text x="252.0" y="277.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">[boring-pirate@NAME]</text>
<text x="252.0" y="292.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">flavours: model, handbook,</text>
<text x="252.0" y="307.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">tools, budget; one run per</text>
<text x="252.0" y="322.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">flavour at a time</text>
<path transform="translate(402,252) scale(0.917)" d="M5.5 8.5h13v11h-13z M12 4.5v4 M9.5 13.5v1 M14.5 13.5v1 M9.5 17h5 M3 13v3 M21 13v3" fill="none" stroke="#5f7867" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="node"><title>services</title><rect x="464" y="244" width="192" height="70" fill="#171e19" stroke="#5f7867" stroke-width="1.2"/>
<text x="474.0" y="262.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#dfdfdf" xml:space="preserve">Services</text>
<text x="474.0" y="277.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">[MCP servers · granted]</text>
<text x="474.0" y="292.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">as far as the Pirate's</text>
<text x="474.0" y="307.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">grants allow</text>
<path transform="translate(624,252) scale(0.917)" d="M9 6.5 3.5 12 9 17.5 M15 6.5 20.5 12 15 17.5" fill="none" stroke="#5f7867" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="node"><title>exec</title><rect x="20" y="394" width="192" height="70" fill="#171e19" stroke="#5f7867" stroke-width="1.2"/>
<text x="30.0" y="412.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#dfdfdf" xml:space="preserve">Executor</text>
<text x="30.0" y="427.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">[systemd unit]</text>
<text x="30.0" y="442.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">exec with a deadline</text>
<text x="30.0" y="457.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">and cleanup</text>
<path transform="translate(180,402) scale(0.917)" d="M12 2.5a9.5 9.5 0 1 1 0 19a9.5 9.5 0 1 1 0-19z M10 8l6 4-6 4z" fill="none" stroke="#5f7867" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="node"><title>home</title><rect x="242" y="394" width="192" height="70" fill="#171e19" stroke="#5f7867" stroke-width="1.2"/>
<text x="252.0" y="412.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#dfdfdf" xml:space="preserve">Home</text>
<text x="252.0" y="427.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">[handbook, work/]</text>
<text x="252.0" y="442.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">its rules; work/ is the</text>
<text x="252.0" y="457.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">only writable folder</text>
<path transform="translate(402,402) scale(0.917)" d="M2.5 6h7l2 2.5h10v11.5h-19z" fill="none" stroke="#5f7867" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="20.0" y="531.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#dfdfdf" xml:space="preserve">Read the picture</text>
<text x="20.0" y="547.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#7b9682" xml:space="preserve">Sage box · the Pond family</text>
<text x="20.0" y="563.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">Grey box · others' software or data</text>
<text x="20.0" y="579.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">Frame: its label says what it is</text>
<text x="20.0" y="595.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">Arrow: from caller to callee</text>
<text x="242.0" y="531.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#dfdfdf" xml:space="preserve">Lines</text>
<text x="242.0" y="547.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#6f8da4" xml:space="preserve">Blue · MCP, wherever it runs</text>
<text x="242.0" y="563.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#9d7f58" xml:space="preserve">Dotted ochre · not MCP, local:</text>
<text x="242.0" y="579.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">a socket, a file, a command</text>
<text x="242.0" y="595.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#9c80ab" xml:space="preserve">Violet · a model provider's API</text>
<text x="464.0" y="531.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#dfdfdf" xml:space="preserve">Scope and limits</text>
<text x="464.0" y="547.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">The Pirate registers its flavours with</text>
<text x="464.0" y="563.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">each Pond it may serve and answers</text>
<text x="464.0" y="579.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">its heartbeat (the arrow back).</text>
<text x="464.0" y="595.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">The answer is a claim; write_actions,</text>
<text x="464.0" y="611.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">each write with its SHA-256, are the</text>
<text x="464.0" y="627.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">evidence. Tools are what a flavour</text>
<text x="464.0" y="643.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">points at, not a sandbox: the account</text>
<text x="464.0" y="659.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">is the boundary.</text>
</svg>
