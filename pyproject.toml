[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "boring-pirates"
version = "0.3.5"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING.md"]
requires-python = ">=3.10"
dependencies = ["mistralai>=2.10,<3", "boring-file-core>=0.7.5,<0.8", "boring-worker-kit>=0.7.5,<0.8", "mcp>=2.2,<2.3", "httpx2>=2.13,<2.14", "exceptiongroup>=1.3; python_version < '3.11'", "boring-registry>=0.7.5,<0.8"]

[project.scripts]
boring-pirate = "boring_pirates.common.ipc:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
follow_imports = "silent"
files = ["src/boring_pirates/common/runtime.py", "src/boring_pirates/common/files.py",
         "src/boring_pirates/common/providers.py", "src/boring_pirates/common/tools.py"]
